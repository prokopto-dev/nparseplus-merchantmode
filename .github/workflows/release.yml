name: Release

# Tag vX.Y.Z (matching PluginMeta.version) to build the installable zip, publish
# it as a GitHub release, and list that version in the nParse+ plugin registry.
#
# Two jobs, and the split is the point. `build` produces the artifact and the two
# facts about it the registry needs — the version and the sha256 — and publishes
# the GitHub release. `publish` calls the registry's own reusable workflow with
# those facts. Nothing here composes an index entry any more: the pull request
# against prokopto-dev/nparseplus-plugins that used to be the last step is
# superseded, and the registry hashes the bytes itself rather than trusting a
# digest that was pasted into a PR body.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Rename this when you rename the plugin package directory.
  PLUGIN_DIR: merchant_mode

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # The two things the publish job cannot work out for itself. `version` is
      # the tag with its v stripped, done HERE, in the repository where you can
      # watch it happen — the registry deliberately does not guess which of
      # `v1.2.0` and `1.2.0` you meant.
      version: ${{ steps.meta.outputs.version }}
      sha256: ${{ steps.zip.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK
        # From PyPI, matching PluginMeta.requires_sdk — the release is
        # validated against an SDK the app would actually accept.
        run: python -m pip install "nparseplus-sdk>=1.0,<2"

      - name: Validate plugin
        run: nparseplus-plugin validate "$PLUGIN_DIR"

      - name: Check tag matches PluginMeta.version
        id: meta
        run: |
          python - <<'EOF'
          import os, sys
          from nparseplus_sdk.loading import load_plugin_factory

          plugin = load_plugin_factory(os.environ["PLUGIN_DIR"])()
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if plugin.meta.version != tag:
              sys.exit(
                  f"tag v{tag} does not match PluginMeta.version "
                  f"{plugin.meta.version} — bump meta.version and re-tag"
              )
          print(f"ok: {plugin.meta.id} v{tag}")
          # Past the gate the two are the same string, so which one is emitted
          # is a matter of what it means: this is the version the plugin
          # DECLARES, which is what the registry is being told.
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={plugin.meta.version}\n")
          EOF

      - name: Build zip (single-root layout the nParse+ installer requires)
        id: zip
        run: |
          set -euo pipefail
          zip -r "${PLUGIN_DIR}.zip" "$PLUGIN_DIR" \
            -x "*/__pycache__/*" -x "*.pyc"
          sha256sum "${PLUGIN_DIR}.zip" | tee sha256.txt
          # An independent claim about the bytes this build produced. The
          # registry downloads the artifact and hashes it too, and publishes
          # ITS hash; sending ours is what makes a disagreement between the two
          # visible instead of silent.
          echo "sha256=$(sha256sum "${PLUGIN_DIR}.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA256: ${{ steps.zip.outputs.sha256 }}
        run: |
          set -euo pipefail
          {
            printf '## Merchant Mode v%s\n\n' "$VERSION"
            printf 'Install through nParse+ → Settings → Plugins → *Browse\n'
            printf 'registry…*, which lists this release once the registry has it,\n'
            printf 'or with *Install from URL* pointed at the zip asset below.\n\n'
            printf 'sha256 of %s.zip:\n\n    %s\n' "$PLUGIN_DIR" "$SHA256"
          } > release-body.md
          # NOT a draft, and that is load-bearing rather than a default. The
          # registry fetches the asset below as an ANONYMOUS caller, and a
          # draft release's asset does not exist for one; publishing it here,
          # before the publish job runs, is the whole ordering constraint.
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-body.md \
            "${PLUGIN_DIR}.zip"

      - name: Check the asset answers an anonymous caller
        env:
          ARTIFACT_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.PLUGIN_DIR }}.zip
        run: |
          set -euo pipefail
          # No credential, deliberately: this is the fetch the registry will
          # make. Failing here, where the message is about a release asset,
          # beats succeeding into a publish that lands with verified: false —
          # a release recorded, its version spent, and its bytes never checked.
          curl --silent --show-error --fail --location --proto '=https' \
               --retry 5 --retry-all-errors --retry-delay 3 --max-time 120 \
               --output /dev/null "$ARTIFACT_URL"
          echo "ok: the release asset downloads unauthenticated"

  publish:
    # The GitHub release is created in the last steps of `build`, so `needs`
    # is what guarantees the artifact-url below resolves before anybody fetches
    # it. Do not run these two in parallel and do not move the release creation
    # into this job.
    needs: build
    # PINNED TO A 40-CHARACTER SHA (nparse-plugin-regserve v0.2.0), never to a
    # branch. A reusable workflow runs as our job with our secret, so `@main`
    # would hand tomorrow's version of somebody else's branch a token that can
    # publish releases of this plugin.
    uses: prokopto-dev/nparse-plugin-regserve/.github/workflows/publish-plugin.yml@0603b68f284eb39a687e75845d70d5a4e5d2f0be
    with:
      plugin-id: merchant-mode
      version: ${{ needs.build.outputs.version }}
      # The zip's name is spelled out rather than taken from env.PLUGIN_DIR:
      # a reusable workflow's `with:` cannot read the env context. Rename the
      # package directory and this line changes with it.
      artifact-url: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/merchant_mode.zip
      artifact-sha256: ${{ needs.build.outputs.sha256 }}
      # Both mirror PluginMeta, which is the only place they are decided.
      sdk-specifier: '>=1.0,<2'
      minimum-app-version: '2.1.0'
      # PLAIN TEXT, at most 2048 bytes, and not Markdown: this is rendered in a
      # text widget inside the app on somebody else's machine, so asterisks
      # arrive as asterisks. The GitHub release body above is the Markdown one;
      # these notes are deliberately not read from it.
      notes: |
        Merchant Mode 0.5.1

        Nothing in the plugin itself changed. This release carries a move: from
        here on Merchant Mode is published to the nParse+ plugin registry by its
        own release pipeline, on tag, rather than by a hand-edited pull request
        against the old plugin index.

        What that buys you is a shorter path between a fix and your copy of it,
        and one honest number: the sha256 listed against this release is one the
        registry computed from the bytes it downloaded, not one anybody typed.

        If you are running 0.5.0 there is nothing here to hurry for. The window,
        the macro packing, the 255-byte line budget, the price history and every
        setting behave exactly as they did.
    secrets:
      # Minted at https://nparseplugins.prokopto.dev/account with the
      # plugin:publish scope, pinned to merchant-mode, and shown exactly once.
      registry-token: ${{ secrets.REGSERVE_TOKEN }}
